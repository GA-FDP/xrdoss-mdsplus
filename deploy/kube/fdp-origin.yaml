# The Pelican origin, running GA's derived image.
#
#   podman kube play deploy/kube/fdp-origin.yaml
#   podman kube down deploy/kube/fdp-origin.yaml
#
# or, supervised by systemd, via deploy/fdp-origin.kube (a quadlet .kube unit).
#
# The image carries the plugins; everything site-specific stays out here, so a
# config change is a restart rather than a rebuild. Bump `image:` to deploy,
# and roll back by putting the previous tag back -- the old image is still in
# the registry.
#
# NOTE: the mounts and ports below are transcribed from d3d-origin-admin's
# site.env. Confirm them against the running container before first use --
# `sudo podman inspect pelican-origin` -- since the live origin is managed
# outside this repo and may carry mounts site.env does not name.
apiVersion: v1
kind: Pod
metadata:
  name: fdp-origin
  labels:
    app: fdp-origin
spec:
  # The plugins listen on the origin's own HTTPS port; no separate port is
  # added by the relay or the point endpoint.
  restartPolicy: Always
  containers:
    - name: origin
      image: ghcr.io/ga-fdp/fdp-origin:7.26.0-fdp2.3.0
      ports:
        - containerPort: 8443
          hostPort: 8443
          protocol: TCP
      volumeMounts:
        # Pelican's own config, including the xrootd.cfg fragment that carries
        # the http.exthandler line. Generated by d3d-origin-admin from
        # site.env; deliberately not baked into the image.
        - name: pelican-config
          mountPath: /etc/pelican
        - name: logs
          mountPath: /data/pelican/logs
        # The archive. Read-only: the origin serves these and must never
        # write them.
        - name: mdsplus-trees
          mountPath: /mnt/beegfs/data/archives/mdsplus
          readOnly: true
        # The point endpoint's two mounts. `pointroot`/`pointurlprefix` in the
        # exthandler line rewrite the index's pelican:// URLs onto the first of
        # these, so the nesting matters: <pointroot>/ptdata.
        - name: ptdata-archive
          mountPath: /fdp-archives/ptdata
          readOnly: true
        - name: ptdata-index
          mountPath: /ptdata-index
          readOnly: true
  volumes:
    - name: pelican-config
      hostPath:
        path: /var/pelican/config
        type: Directory
    - name: logs
      hostPath:
        path: /data/pelican/logs
        type: Directory
    - name: mdsplus-trees
      hostPath:
        path: /mnt/beegfs/data/archives/mdsplus
        type: Directory
    - name: ptdata-archive
      hostPath:
        path: /mnt/beegfs/data/archives/ptdata
        type: Directory
    - name: ptdata-index
      hostPath:
        path: /mnt/beegfs/data/archives/index/json
        type: Directory
