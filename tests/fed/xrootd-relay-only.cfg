# Relay ONLY -- no ofs.osslib line, and therefore no MDSplus needed anywhere in
# the origin image. libXrdHttpMdsip links libXrdUtils, libXrdHttpUtils and libc
# and nothing else (readelf -d), so this is the configuration that answers
# "can the relay be deployed onto a STOCK Pelican origin?".
http.exthandler mdsip /plugins/libXrdHttpMdsip.so prefix=/mdsip,host=localhost,port=8000,idle=300,timeout=30,auth=xrootd,authpath=/mdsip
