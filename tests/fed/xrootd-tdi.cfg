# Injected into Pelican's generated XRootD config via Xrootd.ConfigFile.
#
# The plugin name is UNSUFFIXED on purpose: XRootD appends the plugin version
# itself, so naming libXrdOssMdsplus-5.so here makes it search for
# libXrdOssMdsplus-5-5.so and only succeed via a fallback. See FINDINGS.md.
#
# prefix=/tdi is correct as written: the plugin receives the federation path
# verbatim, with no oss.localroot prefix applied (verified, FINDINGS.md).
ofs.osslib ++ /plugins/libXrdOssMdsplus.so prefix=/tdi server=localhost:8000 cache=16777216 timeout=30000
