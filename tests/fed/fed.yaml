# Minimal public federation for local integration testing. No OIDC, no real
# certificates, no SciTokens: Pelican auto-generates a dev CA and host cert,
# and PublicReads removes the need for tokens on the read path.
#
# NOTE: TLSSkipVerify is top-level. Server.TLSSkipVerify does not exist.
TLSSkipVerify: true

Server:
  EnableUI: false

Origin:
  StorageType: posix
  EnablePublicReads: true
  EnableDirectReads: true
  Exports:
    - FederationPrefix: /test
      StoragePrefix: /data
      Capabilities: ["PublicReads", "Reads", "DirectReads"]
    # The virtual-file namespace. StoragePrefix is nominal — the plugin
    # intercepts before the filesystem is consulted — but the directory must
    # exist or the origin refuses to export it. Listings is deliberately
    # omitted: this namespace is synthetic and unbounded (spec 7.5).
    - FederationPrefix: /tdi
      StoragePrefix: /data/tdi
      Capabilities: ["PublicReads", "Reads", "DirectReads"]
    # The relay namespace. Nothing is ever read from this StoragePrefix -- the
    # XrdHttpExtHandler claims the path before XRootD consults storage at all --
    # but the director needs a registered namespace to know which origin
    # /mdsip/... belongs to, and the origin refuses to export a missing
    # directory.
    # Writes is here only to make the PUT-routability probe conclusive: without
    # it a PUT is refused for lacking the capability, which is indistinguishable
    # from the director not routing PUT at all.
    - FederationPrefix: /mdsip
      StoragePrefix: /data/mdsip
      Capabilities: ["PublicReads", "Reads", "DirectReads", "Writes"]
    # Deliberately NOT PublicReads: this is the namespace whose policy should
    # DENY an unauthenticated caller, which is what makes the auth=xrootd test
    # able to fail. Testing only against a public namespace would prove nothing.
    - FederationPrefix: /mdsip-private
      StoragePrefix: /data/mdsip-private
      Capabilities: ["Reads", "DirectReads"]

Xrootd:
  ConfigFile: /etc/pelican/xrootd-extra.cfg
