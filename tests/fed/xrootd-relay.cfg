# Injected into Pelican's generated XRootD config via Xrootd.ConfigFile.
#
# Loads BOTH plugins, which is how a real origin would run them and also checks
# that they coexist: the osslib wraps storage, the ext handler claims a URL
# prefix, and they should never see each other's requests.
#
# Names are UNSUFFIXED on purpose -- XRootD appends the plugin version itself.
# See FINDINGS.md.
#
# No "+notls" here, unlike the standalone test: the federation origin has TLS
# configured, so this exercises the production loading path.

ofs.osslib ++ /plugins/libXrdOssMdsplus.so prefix=/tdi server=localhost:8000 cache=16777216 timeout=30000 treepath=/trees/%T_%S.datafile

# Two instances, to test authorization in BOTH directions with policy as the
# only lever -- no token minting required:
#
#   /mdsip          gated by /mdsip         (PublicReads)  -> should ALLOW
#   /mdsip-private  gated by /mdsip-private (no PublicReads) -> should DENY
#
# XRootD allows 4 ext handlers and Pelican already loads 2, so this is exactly
# at the limit.
http.exthandler mdsip /plugins/libXrdHttpMdsip.so prefix=/mdsip,host=localhost,port=8000,idle=300,timeout=30,auth=xrootd,authpath=/mdsip

http.exthandler mdsippriv /plugins/libXrdHttpMdsip.so prefix=/mdsip-private,host=localhost,port=8000,idle=300,timeout=30,auth=xrootd,authpath=/mdsip-private
