# Minimal standalone XRootD for exercising the Oss plugin without a federation.
# Uses the native root:// protocol, so no TLS setup is needed.
# @@PLUGIN@@, @@MDSIP@@, @@EXPORT@@ and @@PORT@@ are substituted by run_e2e.sh.

all.role server

xrd.port @@PORT@@
all.adminpath @@WORK@@/admin
all.pidpath   @@WORK@@/run

oss.localroot @@EXPORT@@

# Two namespaces: one the plugin intercepts, one it must forward untouched.
all.export /tdi   nolock
all.export /plain nolock

# Reference the UNSUFFIXED plugin name: XRootD appends the version itself, so
# naming the -5 file here would make it search for -5-5 (see tests/fed/FINDINGS.md).
ofs.osslib ++ @@PLUGIN@@ prefix=/tdi server=@@MDSIP@@ cache=16777216 timeout=30000

# Deliberately no "ofs.authorize" line. The default is off; setting it to 0
# still makes XRootD initialise the authorization subsystem, which then fails
# looking for /opt/xrd/etc/Authfile and takes the whole server down with
# "File system server initialization failed".
