# Minimal XRootD serving only the HTTP point endpoint, for the contract tests.
#
# No TLS and auth=none: this listens on loopback inside a throwaway container
# and exists to prove the wire contract, not the authorization path. The
# authorization path is delegated to XRootD and is exercised where the relay's
# own tests exercise it.
all.adminpath /tmp/xrd-admin
all.pidpath   /tmp/xrd-admin

xrd.protocol http:8080 libXrdHttp-5.so

# +notls is REQUIRED here and must NOT be used in production. Without TLS
# configured, XrdHttpProtocol loads only the handlers carrying that flag
# (LoadExtHandlerNoTls), silently skipping the rest -- the directive is echoed
# at startup either way, so a missing handler shows up as XRootD answering 403
# for the endpoint's own paths rather than as any load error. Production
# configures HTTPS and must not opt out of it.
#
# Note also the UNSUFFIXED library name: XrdOucPinLoader appends the plugin
# version, so naming libXrdHttpMdsip-5.so here would have it look for
# libXrdHttpMdsip-5-5.so.
#
# The relay's mdsip half is configured but never dialled: these tests only
# issue GETs. host/port must still parse.
http.exthandler mdsip +notls /build/libXrdHttpMdsip.so prefix=/mdsip,host=127.0.0.1,port=8000,auth=none,pointprefix=/fdp-d3d/ptdata,pointindex=/ptdata-index,pointurlprefix=pelican://osg-htc.org:443/fdp-d3d/archives,pointroot=/fdp-archives
