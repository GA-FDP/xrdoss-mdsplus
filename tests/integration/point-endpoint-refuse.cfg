# A deliberately half-configured endpoint, used to prove the handler REFUSES
# rather than loading and answering 404 for everything.
#
# This is the only automated coverage of the refuse-to-load logic. It matters
# more than it looks: the point endpoint rides the mdsip relay's exthandler
# directive, so a plugin that refuses takes fdp:// down with it -- and the
# decision is otherwise verified only by hand-tracing.
#
# pointprefix is set and NEITHER pointstoreroot NOR the retired pointroot is,
# so every lookup would 404 and read as absent data rather than as a broken
# deployment. The handler must decline to load at all.
all.adminpath /tmp/xrd-admin
all.pidpath   /tmp/xrd-admin

xrd.protocol http:8080 libXrdHttp-5.so

http.exthandler mdsip +notls /plugins/libXrdHttpMdsip.so prefix=/mdsip,host=127.0.0.1,port=8000,auth=none,pointprefix=/fdp-d3d/ptdata
