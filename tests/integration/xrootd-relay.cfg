# Standalone XRootD exercising the mdsip relay ext handler over plain HTTP.
# @@RELAY@@, @@MDSIP@@, @@HTTPPORT@@, @@PORT@@ and @@WORK@@ are substituted by
# run_relay_e2e.sh.

all.role server

xrd.port @@PORT@@
all.adminpath @@WORK@@/admin
all.pidpath   @@WORK@@/run

oss.localroot @@WORK@@/export
all.export /plain nolock

xrd.protocol http:@@HTTPPORT@@ libXrdHttp-5.so

# "+notls" loads the handler before TLS is configured. Without it XRootD defers
# every ext handler until TLS is up, and this test deliberately runs plain HTTP
# -- the production origin has TLS and does not need the flag.
#
# Reference the UNSUFFIXED library name: XrdOucPinLoader appends the plugin
# version itself, exactly as for ofs.osslib (see tests/fed/FINDINGS.md).
#
# Parms are ONE XrdOucStream::GetWord() token, so they cannot contain spaces;
# comma is the separator.
http.exthandler mdsip +notls @@RELAY@@ prefix=/mdsip,host=127.0.0.1,port=@@MDSIP@@,idle=300,timeout=30,auth=none

# Deliberately no "ofs.authorize" line -- see xrootd-test.cfg for why.
