name: Conda Package CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'release-*'
  pull_request:
    branches:
      - main

jobs:
  # The packages are built with -DBUILD_TESTS=OFF, so without this job nothing
  # would ever run the unit tests -- including the call-framing tests, which
  # cover the transport's most failure-prone logic.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Unit tests
        run: pixi run test

  build_and_test:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from `git describe`, which needs the tags.
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          # The build does not use the pixi environment -- rattler-build makes
          # its own -- so there is nothing to install here.
          run-install: false

      - name: Build conda packages
        env:
          # Absent on pull requests from forks, which have no access to repo
          # secrets. The live half of the transport test self-skips; the
          # resolution half, which is what packaging can actually break, still
          # runs.
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        run: |
          pixi global install rattler-build
          ./build_package.sh "${HOME}/outdir"

      - name: Upload to Anaconda
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          rattler-build upload anaconda \
            --owner ga-fdp \
            --api-key ${{ secrets.ANACONDA_API_TOKEN }} \
            --force \
            "${HOME}"/outdir/linux-64/*.conda
