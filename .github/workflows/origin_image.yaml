# Build the Pelican-derived origin image and publish it to GHCR.
#
# Why the image is built here rather than on the deploy host: the plugins link
# libptd3d, which is C++20. Compiled by the conda toolchain they require
# GLIBCXX_3.4.31, while the AlmaLinux 9 origin image provides 3.4.29 -- so a
# plugin built anywhere but inside this base cannot be loaded by it. Building
# in the base makes the ABI correct by construction.
#
# Design: docs/superpowers/specs/2026-08-23-derived-origin-image-design.md
name: Origin image

on:
  push:
    branches:
      - main
    tags:
      - 'image-*'
  pull_request:
    branches:
      - main
  # Rebuild and publish the versions the Containerfiles name, without needing
  # a new commit or tag. It takes no tag input: one string cannot correctly
  # name both images.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR repository names must be lowercase, and the org is 'GA-FDP',
  # so this cannot be github.repository_owner verbatim.
  OWNER: ga-fdp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN can push to GHCR in this org; no PAT needed
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Pelican origin plus both plugins. Its plugins must be compiled
          # in this exact base -- see the ABI note at the top of this file.
          - name: origin
            containerfile: Containerfile.origin
            image: fdp-origin
            runtime_check: true
          # The mdsip sandbox. Built FROM almalinux:9, so it carries no
          # ABI-to-origin constraint; its acceptance lives inside the
          # Containerfile, which asserts fork/nofork, `cd /`, the absence of
          # `mdsip -m`, and that libptd3d links no curl/fdpio/XrdCl.
          - name: mdsip
            containerfile: Containerfile.mdsip
            image: fdp-mdsip
            runtime_check: false

    steps:
      - uses: actions/checkout@v4

      # Read the versions from the Containerfiles rather than repeating them.
      # They were pinned in five places once; that is how they drift.
      - name: Read the pinned versions
        run: |
          set -eu
          ptd=$(sed -n 's/^ARG PTDATA_VERSION=//p' Containerfile.origin | head -1)
          mds=$(sed -n 's/^ARG PTDATA_VERSION=//p' Containerfile.mdsip | head -1)
          pel=$(sed -n 's/^ARG PELICAN_VERSION=//p' Containerfile.origin | head -1)
          [ -n "$ptd" ] || { echo "::error::no ARG PTDATA_VERSION in Containerfile.origin"; exit 1; }
          [ -n "$pel" ] || { echo "::error::no ARG PELICAN_VERSION in Containerfile.origin"; exit 1; }
          # Both images are built from ONE staged ptdata tarball, checked out
          # below at the version read here. If the two Containerfiles disagree,
          # one of them is silently built from the other's source.
          [ "$ptd" = "$mds" ] || {
            echo "::error::PTDATA_VERSION disagrees: origin=$ptd mdsip=$mds"; exit 1; }
          echo "PTDATA_VERSION=$ptd" >> "$GITHUB_ENV"
          echo "PELICAN_VERSION=$pel" >> "$GITHUB_ENV"
          echo "pelican $pel, ptdata $ptd"

      # PELICAN_VERSION is a human claim about a digest, and the two drift the
      # moment someone rebases the pin without editing the line above it.
      # Harbor knows which tags the digest carries; ask it rather than trust.
      - name: The pinned digest must really be that Pelican
        run: |
          set -eu
          digest=$(sed -n 's/.*origin@\(sha256:[0-9a-f]\{64\}\).*/\1/p' Containerfile.origin | head -1)
          [ -n "$digest" ] || { echo "::error::could not parse the PELICAN_BASE digest"; exit 1; }
          tags=$(curl -sSf --retry 3 \
            "https://hub.opensciencegrid.org/api/v2.0/projects/pelican_platform/repositories/origin/artifacts/$digest?with_tag=true" \
            | python3 -c 'import sys,json; print(" ".join(t["name"] for t in (json.load(sys.stdin).get("tags") or [])))')
          echo "$digest carries: $tags"
          case " $tags " in
            *" v${PELICAN_VERSION} "*) ;;
            *) echo "::error::PELICAN_VERSION=${PELICAN_VERSION}, but the pinned digest is tagged: $tags"
               exit 1 ;;
          esac

      # actions/checkout fails a missing token with "Input required and not
      # supplied: token", which names neither the secret nor the fix. Say it
      # here instead.
      - name: Require the ptdata source token
        run: |
          if [ -z "${{ secrets.PTDATA_SRC_TOKEN }}" ]; then
            echo "::error::PTDATA_SRC_TOKEN is not set. It is a read-only PAT with"\
                 "contents:read on GA-FDP/ptdata, needed because that repository is"\
                 "internal and the built-in GITHUB_TOKEN is scoped to this one."\
                 "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # ptdata is an INTERNAL repository, so the default GITHUB_TOKEN cannot
      # read it -- that token is scoped to this repo alone. PTDATA_SRC_TOKEN is
      # a read-only PAT (contents: read on GA-FDP/ptdata). This is the one
      # credential this pipeline needs that the platform does not provide.
      - name: Check out ptdata at the pinned release
        uses: actions/checkout@v4
        with:
          repository: GA-FDP/ptdata
          ref: release-${{ env.PTDATA_VERSION }}
          token: ${{ secrets.PTDATA_SRC_TOKEN }}
          path: .ptdata-src
          fetch-depth: 0

      # scripts/fetch-ptdata-src.sh prefers a local checkout and uses
      # `git archive`, which is what embeds the export-subst tag the
      # Containerfile asserts against. Point it at the checkout above rather
      # than letting it clone over SSH, which a runner cannot do.
      - name: Stage the ptdata source tarball
        run: PTDATA_CHECKOUT="$PWD/.ptdata-src" ./scripts/fetch-ptdata-src.sh

      - name: Work out the tag
        id: meta
        run: |
          set -eu
          # Each image is named for what is actually in it: the origin by the
          # Pelican it derives from plus the ptdata it carries, the sandbox by
          # ptdata alone -- it is built FROM almalinux:9 and contains no
          # Pelican at all, so a Pelican version in its tag would be a lie.
          # These are the tags deploy/*.container reference, and the scheme the
          # design spec names.
          case "${{ matrix.name }}" in
            origin) release="${PELICAN_VERSION}-fdp${PTDATA_VERSION}" ;;
            mdsip)  release="${PTDATA_VERSION}" ;;
            *) echo "::error::no tag scheme for ${{ matrix.name }}"; exit 1 ;;
          esac

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$release" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # The git tag names the release as a whole. If it disagrees with
            # the Containerfiles, the images would be published under one
            # version and built from another -- fail rather than pick a winner.
            want="${PELICAN_VERSION}-fdp${PTDATA_VERSION}"
            if [ "${GITHUB_REF_NAME#image-}" != "$want" ]; then
              echo "::error::$GITHUB_REF_NAME does not match the Containerfiles (expected image-$want)"
              exit 1
            fi
            echo "tag=$release" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            # A pull request builds and validates but must not publish.
            echo "tag=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # podman, not docker: the image was developed and verified with podman,
      # and the assertions inside the Containerfile are what gate a release.
      # Keeping the same builder keeps "it worked locally" meaningful.
      - name: Build ${{ matrix.name }}
        run: |
          podman build -f ${{ matrix.containerfile }} \
            -t "${REGISTRY}/${OWNER}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}" .

      # The contract suite is the acceptance test: start the built image and
      # ask it for a point record, exactly as a client would. Without shot
      # data on the runner this can only check that the handler loads, which
      # is still the failure that a config or ABI mistake produces.
      - name: The handler must load in the built image
        if: matrix.runtime_check
        run: |
          # Mount the repo's config directly. Writing it to mktemp gives a
          # 0600 file owned by the runner, and with --user 1000 the process
          # inside the container maps to a different host uid and cannot read
          # it -- xrootd then fails with "permission denied" on its config,
          # which looks like a plugin problem and is not. The committed config
          # already names /plugins, so there is nothing to rewrite.
          podman run -d --name probe -p 127.0.0.1:8080:8080 --user 1000 \
            -v "$PWD/tests/integration/point-endpoint.cfg:/etc/xrootd/point.cfg:ro" \
            --entrypoint '["xrootd","-c","/etc/xrootd/point.cfg"]' \
            "${REGISTRY}/${OWNER}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}"
          for _ in $(seq 1 30); do
            podman logs probe 2>&1 | grep -q "point endpoint" && break
            sleep 1
          done
          podman logs probe 2>&1 | tail -20
          podman logs probe 2>&1 | grep -q "XrdHttpMdsip point endpoint" \
            || { echo "::error::the point endpoint did not load"; exit 1; }
          podman rm -f probe

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: steps.meta.outputs.push == 'true'
        run: |
          podman push "${REGISTRY}/${OWNER}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}"
          # A moving :latest is deliberately NOT published. The origin pins an
          # explicit tag so "what is deployed" is answerable, and a rollback is
          # a tag change rather than an archaeology exercise.
